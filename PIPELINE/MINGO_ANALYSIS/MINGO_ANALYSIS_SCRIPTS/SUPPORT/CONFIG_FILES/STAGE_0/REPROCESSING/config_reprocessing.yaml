qa_retry:
  enabled: true
  source_csv: PIPELINE/MINGO_ANALYSIS/MINGO_ANALYSIS_SCRIPTS/QUALITY_ASSURANCE/TOTAL_SUMMARY/OUTPUTS/FILES/qa_all_stations_reprocessing_quality.csv
  selectors:
    - id: all_quality_failures
      target_stations: [1, 2, 3, 4]
      qa_stations: [1, 2, 3, 4]
      quality_statuses: [fail]
      failed_columns_any:
        - '*'

reprocessing_run_matrix:
  enabled: true
  mode: whitelist
  default_steps: []
  stations:
    "0": [0, 1, 2]
    "1": [0, 1, 2]
    "2": [0, 1, 2]
    "3": [0, 1, 2]
    "4": [0, 1, 2]
