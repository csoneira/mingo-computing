# Test 3: configurable event gates over a selected product group.
station: 1

# Used only when station is MINGO00. Dates are then ignored and the script
# chooses the tightest group in this simulation-parameter space. This example
# intentionally ignores flux_cm2_min.
mingo00_close_parameters: [cos_n, z_plane_1, z_plane_2, z_plane_3, z_plane_4, efficiencies, trigger_combinations]

# Ignored for MINGO00 because simulated acquisition dates are not real time.
# start_date: 2026-01-01
# end_date: 2026-03-16
# start_date: 2026-01-06 # HV scan mingo02 start
# end_date: 2026-01-11 # HV scan mingo02 start
start_date: 2026-07-29 01:00 # HV scan mingo01 start
end_date: 2026-07-30 18:00 # HV scan mingo01 end
# Physical stations use a tight chronological block; MINGO00 uses a tight
# cluster in mingo00_close_parameters.
max_datafiles: 120

# Calibration-history window shown before the gate plots. Use "full" for the
# entire Task-2 metadata history, or e.g. "1week" for selected files ± one week.
# Context points are restricted to valid Parquet Lake basenames and use the
# newest calibration execution for each basename.
context: "1week"

# Add this fraction of the selected duration before and after the exact block.
# For example, a 24 h block gets 2.4 h of context on each side.
environment_context_fraction: 0.10

# Gas-gap width used for E/N = k_B V T / (P d). The logged mean bipolar HV
# magnitude is converted from kV to V; pressure is hPa and temperature is °C.
environment_gas_gap_mm: 1.0


# Per-plane strip patterns and cluster sizes are derived from these calibrated
# strip charges. A strip is active when its finite value is > threshold.
# The derived columns usable below are p1..p4_cluster_size and
# p1..p4_strip_topology; topology is a quoted four-character string such as
# "1001" (strips 1 and 4 active).
derived_strip_topology:
  enabled: true
  source_suffix: "qsum_cal"
  active_when: "gt"
  threshold: 0

# One figure per enabled gate, each with four shared-X plane-charge histograms
# split by the derived active-strip cluster size. Cluster sizes 1–4 are all
# displayed as step histograms.
# Values outside x_range are excluded from the bins but counted in the legend
# and CSV. Fixed bins keep this exact and memory-bounded for multi-month runs.
charge_cluster_size_study:
  enabled: true
  bins: 160
  x_range: [0, 500]

# One 2×2 figure per enabled gate. Each panel is the fixed-bin X/Y histogram
# of the fitted track projected to that plane. Fixed ranges keep the monthly
# calculation exact and memory-bounded; panel titles report outside-range events.
plane_xy_histograms:
  enabled: true
  bins: 100
  x_range: [-220, 220]
  y_range: [-220, 220]
  x_column: "event_x"
  y_column: "event_y"
  x_slope_column: "event_xp"
  y_slope_column: "event_yp"

# Per-gate spatial efficiency maps. For each plane, compare exact 1234 events
# with the corresponding missing-plane topology:
# P1 <- 234, P2 <- 134, P3 <- 124, P4 <- 123.
# Efficiency in each X/Y bin is N1234 / (N1234 + Nmissing). Bins, ranges, and
# projection columns inherit from plane_xy_histograms unless overridden here.
efficiency_plane:
  enabled: true

# The ToT-to-charge curve is nonlinear, so summing strip charges after
# calibration need not agree with calibrating the summed strip ToT. Pool all
# valid plane events with at least two positive strip ToTs in one histogram.
charge_calibration_comparison:
  enabled: false
  source_suffix: "qsum_cal"
  min_active_strips: 2
  bins: "auto"

# Gate conditions live separately so this file contains runtime and plot options.
gates_config: "config_test_3_gate_definitions.yaml"

# Events are first counted in each exact timestamp second and then accumulated.
# Rates remain Hz and divide by the number of timestamp-seconds actually present
# in each window, rather than blindly by the nominal window duration.
time_series:
  enabled: true
  time_column: "datetime"
  accumulation_timespan: "10min"

# Exact one-second burst search. Missing seconds are filled with zero only
# inside acquisition segments; larger gaps split the time series so their
# boundaries cannot create fake rate jumps. Delta is rate(t+1 s) - rate(t).
one_second_burst_diagnostics:
  enabled: false
  time_column: "datetime"
  maximum_continuous_gap_seconds: 5
  maximum_histogram_bins: 200

# Fitted track-direction time series. event_xp and event_yp are the stored
# xproj and yproj slopes. Each accumulation window shows the median with
# symmetric median-absolute-deviation (MAD) error bars, once per enabled gate.
fit_projection_time_series:
  enabled: false
  time_column: "datetime"
  xproj_column: "event_xp"
  yproj_column: "event_yp"
  accumulation_timespan: "30min"
  deviation: "median_absolute_deviation"

# Shared definition used everywhere an efficiency product appears.
# Allowed values: "all_planes" gives P1 × P2 × P3 × P4;
# "planes_2_and_3" gives (P2 × P3)². Squaring keeps the correction fourth-order
# while using only the inner planes, which are less affected by acceptance.
efficiency_product_planes: "all_planes"

# Plane efficiency by gate. For each time window and selection, the script counts
# tt_task3_list = 123, 124, 134, 234, and 1234. Plane efficiencies use:
# P1: 1234 / (1234 + 234), P2: 1234 / (1234 + 134),
# P3: 1234 / (1234 + 124), P4: 1234 / (1234 + 123).
# selections: all means every individual gate plus every observed exact combined
# gate selection. Alternatively provide entries such as:
# selections:
#   - {kind: individual, gate_label: "Q80"}
#   - {kind: combined_exact, gate_labels: ["Q80", "CS01"]}
efficiency_time_series:
  enabled: false
  time_column: "datetime"
  topology_column: "tt_task3_list"
  accumulation_timespan: "10min"
  selections: all
  include_combined_zero: false

# Comparison of all and only the gates with enabled: true. The first figure has
# four rows (one per plane) with enabled gates overlaid. The second has four
# rows: total selected-gate rate, configured efficiency product, the 1234 rate
# corrected by 1 / efficiency product, and its per-gate relative rate. A
# two-panel stability figure compares uncorrected and corrected 1234-rate
# histograms with Gaussian fits and fitted sigma values. Another figure shows
# uncorrected and corrected 1234 rates divided by their respective per-gate
# means, both versus time and versus synchronized E/N.
enabled_gate_comparison:
  enabled: true
  time_column: "datetime"
  topology_column: "tt_task3_list"
  accumulation_timespan: "10min"
  rate_stability_histogram_bins: 80
  # Both relative corrected-rate panels use y = [1 - val, 1 + val].
  relative_corrected_rate_y_half_range: 0.5
  corrected_to_all_ratio:
    enabled: false
    # Numerator: efficiency-corrected 1234 rate for this enabled gate.
    gate_label: "NG_CS02"
    # Denominator: total selected-event rate of the enabled ALL gate.
    all_gate_label: "ALL"

# Definitive 1234 efficiency correction. Automatically skipped for MINGO00,
# whose simulated products have no T, P, or RH channels. External T, P, and RH Fourier power
# spectra are smoothed and combined into one continuous spectral response. Its
# square-root-like amplitude gain is applied frequency-by-frequency to every
# plane-efficiency FFT. There is no selected-period list and no hard cutoff.
# The configured smoothly filtered efficiencies are multiplied, inverted, and applied
# to the measured 1234 rate for every gate.
environment_frequency_efficiency_correction:
  enabled: false
  # Gaussian width along the uniformly spaced FFT-frequency bins.
  spectrum_smoothing_sigma_bins: 6.0
  # Power response ** exponent gives the Fourier-amplitude gain. 0.5 converts
  # the normalized power envelope to its corresponding amplitude envelope.
  filter_response_exponent: 0.5
  # Optional minimum gain at frequencies with negligible environmental power.
  filter_response_floor: 0.0
  environment_variables:
    Temperature: "sensors_ext_Temperature_ext"
    Pressure: "sensors_ext_Pressure_ext"
    Relative humidity: "sensors_ext_RH_ext"

# Three-row diagnostic for one gate: 1234 rate, plane efficiencies plus their
# product, and the efficiency-corrected 1234 rate. The rate denominator is the
# number of timestamp-seconds actually observed in each accumulation window.
plane_combinations:
  enabled: false
  selection_kind: "individual"
  gate_label: "NGT"
  time_column: "datetime"
  topology_column: "tt_task3_list"
  accumulation_timespan: "10min"

# Configurable celestial-sphere time series for every enabled individual gate:
# one vertical cap plus either two hemispheres or four azimuth sectors. Each gate
# plot also shows every unique pairwise regional-fraction ratio. A separate two-panel plot
# correlates both the fractions and their pairwise ratios with the configured plane-
# efficiency product, recomputed in the same angular accumulation windows. Azimuth
# regions use [lower, upper) boundaries after wrapping phi to [-180, 180) degrees.
angular_time_series:
  enabled: false
  time_column: "datetime"
  theta_column: "event_theta"
  phi_column: "event_phi"
  accumulation_timespan: "30min"
  convert_radians_to_degrees: true
  vertical_max_theta_degrees: 15
  default_division_case: "N_E_S_W"
  division_cases:
    N_E_S_W:
      azimuth_edges_degrees: [-45, 45, 135, 225, 315]
      azimuth_region_labels: [North, East, South, West]
    AZIMUTH_0_90_180_270:
      azimuth_edges_degrees: [0, 90, 180, 270, 360]
      azimuth_region_labels: [Sector 0-90, Sector 90-180, Sector 180-270, Sector 270-360]
    VERTICAL_EAST_WEST:
      azimuth_edges_degrees: [0, 180, 360]
      azimuth_region_labels: [East, West]
    VERTICAL_NORTH_SOUTH:
      azimuth_edges_degrees: [-90, 90, 270]
      azimuth_region_labels: [North, South]

angular_histograms:
  enabled: false
  plane_z_unit: "mm"
  # Individual gates share one density panel; exact combined codes share a
  # second density panel using shared bins and x-axis for each angle.
  convert_radians_to_degrees: true
  # Only show enabled individual gates; omit mutually exclusive combinations.
  include_combined_exact: false
  # Events that satisfy no enabled gate are excluded from combined-code plots.
  include_combined_zero: false
  # Scan the independent cut orientations [-90, 90). For each phi cut,
  # compare the wrapped half-planes left=[cut-180, cut) and
  # right=[cut, cut+180). Rotating the cut 180 degrees only swaps the sides.
  phi_asymmetry_scan:
    enabled: false
    variable_slug: "phi"
    cut_step: 1
    # Also write asymmetry as 100 * (N_left - N_right) / (N_left + N_right).
    plot_percentage: true
    percentage_limit: 50
  variables:
    - column: "event_theta"
      label: "Theta"
      slug: "theta"
      bins: 90
      range: [0, 90]
    - column: "event_phi"
      label: "Phi"
      slug: "phi"
      bins: 180
      range: [-180, 180]
    # Signed projection along the phi=0 / phi=180 axis. Opposite azimuthal
    # directions therefore receive opposite theta signs.
    - column: "event_theta"
      label: "Signed theta: theta × sign(cos(phi))"
      slug: "theta_signed"
      sign_by_cosine_column: "event_phi"
      bins: 180
      range: [-90, 90]


# Reuse both topology diagnostics below for these additional two-strip gates.
# The active strip pair must match the two 1 bits in the topology.
additional_topology_diagnostic_targets:
  - {gate_label: "0110", topology: "0110", first_strip: 2, second_strip: 3, diagonal_limits: {tdif_cal: 0.25, tsum_cal: 2.5}}
  - {gate_label: "0101", topology: "0101", first_strip: 2, second_strip: 4}
  - {gate_label: "1010", topology: "1010", first_strip: 1, second_strip: 3}
  - {gate_label: "1100", topology: "1100", first_strip: 1, second_strip: 2, diagonal_limits: {tdif_cal: 0.25, tsum_cal: 2.5}}
  - {gate_label: "0011", topology: "0011", first_strip: 3, second_strip: 4, diagonal_limits: {tdif_cal: 0.25, tsum_cal: 2.5}}

# 1001-topology diagnostic: columns are planes 1..4; rows compare strip 1 with
# strip 4 for Q_sum, T_dif, Q_dif, and T_sum. Axes are shared within rows.
topology_charge_scatter:
  enabled: false
  gate_label: "1001"
  topology: "1001"
  variables:
    - {suffix: "qsum_cal", label: "Calibrated Q_sum"}
    - {suffix: "tdif_cal", label: "Calibrated T_dif"}
    - {suffix: "qdif_cal", label: "Calibrated Q_dif"}
    - {suffix: "tsum_cal", label: "Calibrated T_sum"}
  x_strip: 1
  y_strip: 4
  max_points_per_file: 50000
  plot_quantiles: [0.001, 0.999]

# For the same gate/topology selection, show the stored per-plane Y used by
# Task 3 and compare it event-by-event with the two active-strip charges.
# The Y overview contains time scatter and histogram; the charge figure contains
# Q1 / (Q1 + Q4) versus Y and Q1 versus Q4 colored by Y.
topology_y_position:
  enabled: false
  gate_label: "1001"
  topology: "1001"
  time_column: "datetime"
  charge_suffix: "qsum_cal"
  first_strip: 1
  second_strip: 4
  bins: 80
  range: [-150, 150]
  max_scatter_points_per_plane: 100000
  omit_zero: false
