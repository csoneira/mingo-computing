default:
  default_ncols: 4
  default_max_columns_per_plot: 12

special:
  - name: efficiencies
    mode: columns
    ncols: 3
    columns:
      - P*_eff*
  
  - name: efficiencies_only
    mode: columns
    ncols: 4
    sharey: true
    columns:
      - P1_eff
      - P1_eff_plateau
      - P1_eff_overall
      - P1_eff_median_x
      - P2_eff
      - P2_eff_plateau
      - P2_eff_overall
      - P2_eff_median_x
      - P3_eff
      - P3_eff_plateau
      - P3_eff_overall
      - P3_eff_median_x
      - P4_eff
      - P4_eff_plateau
      - P4_eff_overall
      - P4_eff_median_x

  - name: rates
    mode: columns
    ncols: 4
    columns:
      - rate_*_hz
      - four_plane_robust_hz
