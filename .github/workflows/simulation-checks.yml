name: Simulation Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  simulation-checks:
    runs-on: ubuntu-latest
    env:
      GEOMETRY_ID: "0"
      EVENT_ID: "0"
      MAX_EVENTS: "50000"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CONTEXTUAL/CONFIG/CONTENTS/packages/python-lock.txt

      - name: Run reproducible simulation unit tests
        run: |
          python -m pytest -q PIPELINE/MINGO_DIGITAL_TWIN/MASTER_STEPS/tests

      - name: Validate recovery manifests without activating services
        run: |
          python -m unittest discover -s CONTEXTUAL/CONFIG/SETUP/tests -v
          bash CONTEXTUAL/CONFIG/SETUP/setup.sh --dry-run
