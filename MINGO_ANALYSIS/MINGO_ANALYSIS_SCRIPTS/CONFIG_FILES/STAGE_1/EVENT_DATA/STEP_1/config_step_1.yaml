event_data_step1_run_matrix:
  enabled: true
  mode: whitelist
  default_tasks: []
  idle_sleep_seconds: 300
  already_running_log_seconds: 300
  config_refresh_seconds: 60
  stations:
    "0": [0, 1, 2, 3, 4, 5]
    "1": [0, 1, 2, 3, 4, 5]
    "2": [0, 1, 2, 3, 4, 5]
    "3": []
    "4": []

self_trigger_step1_run_matrix:
  enabled: true
  mode: whitelist
  default_tasks: []
  stations:
    "0": [1, 2]
    "1": [1, 2]
    "2": [1, 2]
    "3": []
    "4": []

event_data_resource_limits:
  mem_used_pct_max: 95
  swap_used_pct_max: 95
  swap_used_kb_max: 4194304
  cpu_used_pct_max: 95
  resource_backoff_seconds: 20

step_1_overrides:
  # Non-empty values override lower-level STEP_1 task configs.
  # Leave a value blank to defer to each TASK_*/config_task_*.yaml.
  # Periodic plotting enables the explicitly listed aliases on schedule.
  # Set the interval to null to disable periodic plotting; each task's
  # create_plots boolean remains the global on/off switch.
  complete_reanalysis: true
  create_plots:
  # Generate each task's configured QA plots at most once per interval (hours).
  # Alias selections remain controlled by TASK_*/config_plots_task_*.yaml.
  periodic_plotting_interval_hours: null
  keep_all_columns_output: true
  save_removed_channel_values: false
  save_time_slewing_pair_residuals: false
  joined_analysis_files: 3
  joined_analysis_time_tolerance_hours: 24
  # File choice: qa (QA first, then newest fallback), new (newest available), random (any available).
  file_selection_mode: random

metadata_outputs:
  activation: true
  calibration: true
  chi2_four_plane: true
  deep_filter: true
  efficiency: true
  execution: true
  filter: true
  gate_test: true
  noise_control: true
  pattern: true
  profiling: true
  rate_histogram: true
  specific: true
  status: true
  trigger_type: true

logging_outputs:
  filter_metrics: true
