site_name: MINGO Computing Documentation
site_url: https://csoneira.github.io/mingo-computing/
repo_name: csoneira/mingo-computing
repo_url: https://github.com/csoneira/mingo-computing

nav:
  - Home: index.md
  - Detector Operations:
      - Overview: ESSENTIAL/index.md
      - Configuration: ESSENTIAL/configuration.md
      - Calibration: ESSENTIAL/calibration.md
      - Measuring: ESSENTIAL/measuring.md
      - Monitoring: ESSENTIAL/monitoring.md
  - Hardware and DAQ:
      - Hardware: ESSENTIAL/hardware.md
      - DAQ and Infrastructure: ESSENTIAL/daq-and-infrastructure.md
      - HLD Structure: ESSENTIAL/hld_structure.md
  - Collaboration and Publications:
      - Collaborators: ESSENTIAL/collaborators.md
      - Publications: ESSENTIAL/publications.md
      - Publications and Reports: ESSENTIAL/publications-and-reports.md
  - Reference:
      - Glossary: ESSENTIAL/glossary.md
      - Script Header Standard: ESSENTIAL/script-header-standard.md
      - Documentation Photos: ESSENTIAL/documentation-photo-inventory.md
      - Help: ESSENTIAL/help.md
      - Legacy To-do: ESSENTIAL/todo.md
  - Research Notebooks:
      - Notebook Archive: NOTEBOOKS/index.md
      - Notebook Template: NOTEBOOKS/YYYY_MM_DD_notebook.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
  logo: assets/logos/logo_mingo_network.png
  favicon: assets/logos/logo_mingo_network.png
  palette:
    - scheme: default
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/js/mermaid-init.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
